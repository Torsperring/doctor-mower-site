<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Thank You | Doctor Mower</title>
  <style>
    :root{--bg:#050505;--panel:#111;--text:#f7f7f4;--muted:#c7c7c2;--gold:#c79a24;--bright:#e0b33b;--dark:#806315}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,rgba(199,154,36,.12),transparent 34%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;padding:24px;line-height:1.55}
    .card{width:min(720px,100%);text-align:center;background:linear-gradient(#161616,#0d0d0d);border:1px solid #3a321d;border-radius:14px;padding:52px 34px;box-shadow:0 18px 55px rgba(0,0,0,.35)}
    .gear{font-size:64px;color:var(--bright);line-height:1;margin-bottom:18px}
    .eyebrow{color:var(--bright);font-weight:900;letter-spacing:.09em;text-transform:uppercase;font-size:.86rem}
    h1{font-size:clamp(2.2rem,7vw,4rem);line-height:1.05;text-transform:uppercase;margin:10px 0 20px}
    p{font-size:1.12rem;color:var(--muted);max-width:560px;margin:0 auto 14px}
    .cta{display:inline-block;margin-top:22px;padding:14px 24px;border:1px solid #e2b640;border-radius:8px;background:linear-gradient(90deg,#a87c13,#d5a82e);color:white;text-decoration:none;font-weight:900;text-transform:uppercase}
    .contact{margin-top:28px;font-size:.95rem;color:var(--muted)}
    .contact a{color:var(--bright);text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="gear" aria-hidden="true">⚙</div>
    <div class="eyebrow">Service Request Received</div>
    <h1>Thank You!</h1>
    <p>Your service request has been successfully sent to Doctor Mower.</p>
    <p>We’ll review the information you provided and get back to you about your onsite service or repair.</p>
    <a class="cta" href="/#home">Return to Home</a>
    <div class="contact">Need to speak with us? <a href="tel:0480100333">Call or text 0480 100 333</a></div>
  </main>
</body>
</html>
